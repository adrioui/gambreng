<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gambreng - Gacha Theme Selector</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="canvas-container"></div>

    <div id="ui-overlay">
      <div id="title">
        <div id="title-wordmark">GAMBRENG</div>
        <p id="title-kicker">acak tema • pilih pemenang • gaya komik rame</p>
      </div>

      <div id="participant-themes" class="hidden"></div>

      <div id="control-cluster">
        <p id="control-chip">tekan tombol atau klik tuas mesin</p>
        <button id="edit-btn">EDIT PESERTA</button>
        <button id="start-btn">MULAI GAMBRENG</button>
        <button id="reset-btn" class="hidden">ULANGI</button>
      </div>
    </div>

    <div id="editor-overlay" class="hidden">
      <form id="editor-form">
        <p class="editor-kicker">susun nama, tema, dan warna biar siap digambreng</p>
        <h2>Edit Peserta</h2>
        <div class="editor-rows"></div>
        <div class="editor-actions">
          <button type="button" id="save-editor-btn">SIMPAN</button>
          <button type="button" id="cancel-editor-btn">BATAL</button>
          <button type="button" id="copy-link-btn">SALIN LINK</button>
        </div>
      </form>
    </div>

    <div id="result-overlay" class="hidden">
      <div id="result-content">
        <p class="result-kicker">hasil gambreng hari ini</p>
        <h2>TEMA TERPILIH:</h2>
        <h1 id="winner-theme"></h1>
        <p id="winner-participant"></p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
